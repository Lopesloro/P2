<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Demandas</title>
    <link rel="stylesheet" href="listagem-style.css">
</head>
<body>

    <header>
        <h1>Nome do Site</h1>
        <a href="#menu">Menu</a>
    </header>

    <div class="principal">

        <h1 id="titulo">Listagem de Demandas</h1>

        <form class="busca" id="formulario_busca" novalidate>
            <input type="text" id="campoBusca" name="busca" class="pesquisa" placeholder="Buscar demanda" maxlength="60" autocomplete="off" aria-describedby="erroBusca">
            <button type="submit">Buscar</button>
        </form>

        <p class="erro" id="erroBusca" role="alert" hidden></p>

        <!-- Aviso de busca sem resultado. O listagem.js ja procurava por
             este elemento, mas ele nao existia no HTML. -->
        <p class="erro" id="sem_resultado" role="alert" hidden>Nenhuma demanda encontrada.</p>

        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Tipo</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Projeto</th>
                        <th>Responsável</th>
                        <th>Data de Criação</th>
                        <th>Prazo de Finalização</th>
                        <th>Detalhes</th>
                    </tr>
                </thead>

                <!-- As linhas sao montadas por listagem.dados.js, com as
                     demandas que vem do servidor -->
                <tbody></tbody>
            </table>
        </div>

        <p class="total">Carregando...</p>

    </div>

    <!-- Monta a tabela com as demandas que vem do servidor.
         Autor: Gabriel Lopes Londe Rodrigues -->
    <script src="listagem.dados.js"></script>

    <!-- Busca da listagem. O arquivo ja existia, mas nunca chegava a ser
         carregado porque faltava esta linha no HTML. -->
    <script src="listagem.js"></script>

</body>
</html>
