<!--
  Autor do arquivo: Gabriel Lopes Londe Rodrigues
  Tela de Detalhes da Demanda - PI-II-TIME-11

  As areas desta tela nascem vazias e sao preenchidas pelo arquivo
  detalhes.demanda.js, com os dados que vem do servidor. Por isso ela
  precisa ser aberta em http://localhost:3000, com o servidor ligado, e
  nao com um duplo clique no arquivo.
-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Demanda</title>
    <link rel="stylesheet" href="detalhes.demanda.style.css">
</head>

<body>
    <header>
        <div class="cabecalho">
            <div class="marca">Acompanhamento de <span>Demandas</span></div>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="listagem.html" class="ativo">Demandas</a>
            </nav>

            <div class="usuario">
                <strong>Eduardo Martins Colmati</strong>
                Administrador
            </div>
        </div>
    </header>

    <main>
        <!--
          Botao de voltar para a listagem.

          E um link comum, sem JavaScript nenhum. Assim ele funciona pelo
          teclado, permite abrir a listagem em outra aba com o botao do
          meio do mouse, e continua funcionando mesmo se o JavaScript
          falhar.
        -->
        <a href="listagem.html" class="botao secundario voltar">
            &larr; Voltar para a listagem
        </a>

        <h1 id="titulo"></h1>

        <div class="etiquetas">
            <span id="etiqueta_status" class="etiqueta"></span>
            <span id="etiqueta_prioridade" class="etiqueta"></span>
            <span id="etiqueta_tipo" class="etiqueta"></span>
        </div>

        <div class="colunas">
            <!-- Coluna do conteudo -->
            <div>
                <div class="card">
                    <h2>Descricao</h2>
                    <p id="descricao"></p>
                </div>

                <!-- Os botoes que aparecem aqui dependem do status atual.
                     Quem decide quais existem e o servidor. -->
                <div class="card" id="secao_acoes">
                    <h2>Atualizar andamento</h2>
                    <p class="apoio" id="status_atual"></p>
                    <div id="botoes_status"></div>
                </div>

                <div class="card">
                    <h2>Comentarios <span class="data" id="contador"></span></h2>

                    <form id="form_comentario">
                        <label for="comentario">Escrever um comentario</label>
                        <textarea id="comentario" placeholder="Registre uma duvida ou uma observacao"></textarea>
                        <p class="erro" id="erro_comentario"></p>
                        <button type="submit" class="botao principal">Enviar comentario</button>
                    </form>

                    <div id="lista_comentarios"></div>
                </div>
            </div>

            <!-- Coluna lateral -->
            <div>
                <div class="card">
                    <h2>Informacoes</h2>

                    <dl class="ficha" id="ficha"></dl>
                </div>

                <div class="card">
                    <h2>Historico de alteracoes</h2>
                    <ul id="lista_historico"></ul>
                </div>
            </div>
        </div>
    </main>

    <script src="detalhes.demanda.js"></script>
</body>

</html>
